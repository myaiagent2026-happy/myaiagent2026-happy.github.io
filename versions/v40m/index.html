<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>大話骰 v40m｜多人連線（2-6人）</title>
  <style>
    :root{--bg:#07130d;--card:#0d2016;--line:#1e4632;--text:#e8f3ea;--muted:#a4bdaa;--gold1:#ffe4a8;--gold2:#d89a34}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(1200px 900px at 50% 0%, #123424 0%, #07130d 55%, #030806 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}
    .app{max-width:920px;margin:0 auto;padding:14px}
    h1{margin:6px 0 2px;font-size:34px;text-align:center}
    .sub{text-align:center;color:#d2bd88;font-weight:700;letter-spacing:1px;margin-bottom:10px}
    .card{background:linear-gradient(180deg,#10271b,#0b1d14);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 10px 28px rgba(0,0,0,.35)}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .sep{height:1px;background:#1e4331;margin:10px 0}
    .pill{padding:5px 9px;border:1px solid #2e5f43;border-radius:999px;background:#0a1b13;color:#cfead6;font-size:13px}
    .big{font-size:20px;font-weight:800}
    .muted{color:var(--muted)}
    .warn{color:#ffd8a2}
    .hide{display:none}
    input,select,button{font:inherit}
    input,select{background:#08150f;color:#eaf5ec;border:1px solid #224633;border-radius:10px;padding:8px 10px}
    .btn{border:none;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
    .btn-gold{background:linear-gradient(180deg,var(--gold1),#f5c15f 45%,var(--gold2));color:#4c2b00;box-shadow:0 3px 0 #7a4b0e, inset 0 1px 0 #fff8da}
    .btn-dark{background:#173425;color:#ddf1e2;border:1px solid #2a5d42}
    .btn-danger{background:#7e1e1e;color:#ffe8e8;border:1px solid #b84848}
    .players{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
    .pbox{border:1px solid #28553d;border-radius:12px;padding:8px;background:#0a1b13}
    .dead{opacity:.45;filter:grayscale(1)}
    .stage{position:relative;overflow:hidden;border:1px solid rgba(255,214,146,.26);border-radius:18px;background:linear-gradient(180deg,rgba(8,27,16,.58),rgba(8,20,13,.72));padding:8px}
    #view{width:100%;height:220px;display:block;border-radius:12px}
    #myDice{font-size:15px;color:#d2ecd9;margin-top:6px;word-break:break-all}
    .log{max-height:220px;overflow:auto;background:#07130d;border:1px solid #234532;border-radius:10px;padding:8px;font-size:14px;line-height:1.5}
  </style>
</head>
<body>
<div class="app">
  <h1>🎲 大話骰</h1>
  <div class="sub">v40m｜多人連線模式（2–6人，各自手機）</div>

  <div id="lobby" class="card">
    <div class="big">連線大廳</div>
    <div class="sep"></div>
    <div class="row">
      <label>你的名字</label>
      <input id="myName" placeholder="例如：Garett" value="玩家" />
      <button id="hostBtn" class="btn btn-gold">開房（房主）</button>
    </div>
    <div class="row" style="margin-top:8px">
      <label>加入房間碼</label>
      <input id="roomInput" placeholder="例如：ld-abc123" />
      <button id="joinBtn" class="btn btn-dark">加入</button>
    </div>
    <div id="connInfo" class="muted" style="margin-top:8px"></div>
    <div id="hostPanel" class="hide" style="margin-top:10px">
      <div class="pill">房間碼：<b id="roomCode"></b></div>
      <div class="muted" style="margin-top:6px">把房間碼給朋友加入（最多6人）</div>
      <button id="startGameBtn" class="btn btn-gold" style="margin-top:8px">開始遊戲</button>
    </div>
  </div>

  <div id="game" class="hide">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div id="roundInfo" class="big">第 1 回合</div>
        <div id="turnInfo" class="pill">等待中</div>
      </div>
      <div class="sep"></div>
      <div id="bidInfo" class="big">當前叫骰：未開始</div>
      <div id="roleInfo" class="muted" style="margin-top:6px"></div>
    </div>

    <div class="card stage">
      <canvas id="view"></canvas>
      <div id="myDice" class="hide"></div>
    </div>

    <div class="card">
      <div class="big">玩家狀態</div>
      <div class="sep"></div>
      <div id="playersBoard" class="players"></div>
    </div>

    <div class="card">
      <div class="big">你的操作</div>
      <div class="sep"></div>
      <div id="privateHint" class="warn">等待房主開始…</div>
      <div class="row" style="margin-top:8px">
        <button id="rollBtn" class="btn btn-gold">🎲 擲骰（本手）</button>
        <button id="hideDiceBtn" class="btn btn-dark hide">收起骰面</button>
      </div>
      <div class="sep"></div>
      <div class="row">
        <label>出價：</label>
        <input id="qty" type="number" min="1" value="1" style="width:90px" />
        <label>個</label>
        <select id="face"></select>
        <label>點</label>
        <button id="bidBtn" class="btn btn-gold">出價</button>
        <button id="callBtn" class="btn btn-danger">開（質疑）</button>
      </div>
      <div class="muted" style="margin-top:6px">規則：新出價必須更高（數量更大，或同數量但點數更大）</div>
    </div>

    <div class="card">
      <div class="big">回合紀錄</div>
      <div class="sep"></div>
      <div id="log" class="log"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
(() => {
  const qs = s => document.querySelector(s);
  const diceGlyph = ['⚀','⚁','⚂','⚃','⚄','⚅'];
  const MAX_PLAYERS = 6;

  const net = {
    peer: null,
    isHost: false,
    roomId: null,
    selfId: null,
    hostConn: null,
    conns: new Map() // host only: peerId -> conn
  };

  const game = {
    started: false,
    players: [], // public: {id,name,diceCount,alive}
    turn: 0,
    round: 1,
    bid: null,
    myDice: [1,1,1,1,1], // private from host
    log: []
  };

  // ===== 3D Stage =====
  const canvas = qs('#view');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2.5));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(36,1,0.1,100);
  camera.position.set(0,6.9,8.3); camera.lookAt(0,-0.3,0);
  scene.add(new THREE.HemisphereLight(0xe9ffd9,0x0f2d1c,1.08));
  const d=new THREE.DirectionalLight(0xfff3df,1.16);
  d.position.set(0.8,9.4,3.2); d.castShadow=true;
  d.shadow.mapSize.set(1024,1024);
  d.shadow.camera.near=1; d.shadow.camera.far=24;
  d.shadow.camera.left=-8; d.shadow.camera.right=8; d.shadow.camera.top=7; d.shadow.camera.bottom=-7;
  d.shadow.bias=-0.00012; d.shadow.normalBias=0.018;
  scene.add(d);

  const FLOOR_Y=-0.83;
  function feltTexture(){const c=document.createElement('canvas');c.width=1024;c.height=512;const g=c.getContext('2d');g.fillStyle='#0a2e1e';g.fillRect(0,0,1024,512);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;return t;}
  const table = new THREE.Mesh(new THREE.CylinderGeometry(6,6,0.42,180,1,false),[
    new THREE.MeshStandardMaterial({color:0x08220e,roughness:.9,metalness:.02}),
    new THREE.MeshStandardMaterial({map:feltTexture(),roughness:.98,metalness:0}),
    new THREE.MeshStandardMaterial({color:0x0a2e1e,roughness:.95,metalness:0})
  ]);
  table.scale.set(1.5666666666666667,1,1.5666666666666667); // 9.4
  table.position.set(0,FLOOR_Y-0.21,0.55); table.receiveShadow=true; scene.add(table);
  const rail = new THREE.Mesh(new THREE.TorusGeometry(9.14,0.34,24,220), new THREE.MeshStandardMaterial({color:0x9e5f30,roughness:.44,metalness:.28}));
  rail.rotation.x=Math.PI/2; rail.rotation.z=Math.PI; rail.position.set(0,FLOOR_Y+0.34,0.55); scene.add(rail);

  function faceTex(n){
    const TEX=1024, SCALE=TEX/256;
    const c=document.createElement('canvas'); c.width=TEX; c.height=TEX;
    const g=c.getContext('2d');
    const base=g.createLinearGradient(0,0,TEX,TEX); base.addColorStop(0,'#fff'); base.addColorStop(1,'#e9edf2'); g.fillStyle=base; g.fillRect(0,0,TEX,TEX);
    const shine=g.createRadialGradient(TEX*0.3,TEX*0.26,TEX*0.02,TEX*0.3,TEX*0.26,TEX*0.55); shine.addColorStop(0,'rgba(255,255,255,.7)'); shine.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=shine; g.fillRect(0,0,TEX,TEX);
    g.strokeStyle='#cbd3dc'; g.lineWidth=5*SCALE; g.strokeRect(3*SCALE,3*SCALE,250*SCALE,250*SCALE);
    const pos={1:[[128,128]],2:[[64,64],[192,192]],3:[[64,64],[128,128],[192,192]],4:[[64,64],[192,64],[64,192],[192,192]],5:[[64,64],[192,64],[128,128],[64,192],[192,192]],6:[[64,64],[192,64],[64,128],[192,128],[64,192],[192,192]]};
    g.fillStyle=(n===1)?'#ff2d2d':'#1b2736';
    for(const [x,y] of pos[n]){ g.beginPath(); g.arc(x*SCALE,y*SCALE,21.5*SCALE,0,Math.PI*2); g.fill(); }
    const t=new THREE.CanvasTexture(c); t.anisotropy=Math.min(16, renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 4); return t;
  }
  const materialsFor=()=>[1,6,2,5,3,4].map(v=>new THREE.MeshPhysicalMaterial({map:faceTex(v),roughness:.12,metalness:.04,clearcoat:.8,clearcoatRoughness:.1}));
  const geo = new THREE.BoxGeometry(1.65,1.65,1.65,8,8,8);
  const dice=[]; const startX=-4.8, spacing=2.4;
  for(let i=0;i<5;i++){ const m=new THREE.Mesh(geo,materialsFor()); m.position.set(startX+i*spacing,0,0); m.castShadow=true; m.receiveShadow=true; scene.add(m); dice.push({mesh:m,start:new THREE.Euler(),target:new THREE.Euler(),t0:0,dur:900}); }
  function rotFor(v){return ({1:[0,0,Math.PI/2],6:[0,0,-Math.PI/2],2:[0,0,0],5:[Math.PI,0,0],3:[-Math.PI/2,0,0],4:[Math.PI/2,0,0]})[v];}
  function rollTo(nums){
    const now=performance.now();
    dice.forEach((d,i)=>{const v=nums[i]||1; d.start.copy(d.mesh.rotation); const [rx,ry,rz]=rotFor(v); d.target.set(rx+2*Math.PI*(5+Math.floor(Math.random()*5)), ry+2*Math.PI*(5+Math.floor(Math.random()*5)), rz+2*Math.PI*(4+Math.floor(Math.random()*4))); d.t0=now+Math.floor(Math.random()*130); d.dur=850+Math.floor(Math.random()*700);});
  }
  function initOnes(){dice.forEach(d=>{const [rx,ry,rz]=rotFor(1); d.mesh.rotation.set(rx,ry,rz);});}
  initOnes();
  function setSize(){const w=canvas.clientWidth,h=canvas.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();}
  setSize(); window.addEventListener('resize',setSize);
  function animate(t){for(const d of dice){const p=Math.min(1,Math.max(0,(t-d.t0)/d.dur)); const e=1-Math.pow(1-p,1.35); d.mesh.rotation.x=d.start.x+(d.target.x-d.start.x)*e; d.mesh.rotation.y=d.start.y+(d.target.y-d.start.y)*e; d.mesh.rotation.z=d.start.z+(d.target.z-d.start.z)*e; d.mesh.position.y=(p<1)?Math.sin(p*Math.PI)*0.6:0;} renderer.render(scene,camera); requestAnimationFrame(animate);} requestAnimationFrame(animate);

  function addLog(msg){ game.log.unshift(msg); qs('#log').innerHTML = game.log.slice(0,120).map(x=>`<div>${x}</div>`).join(''); }

  // ===== Networking helpers =====
  function sendHost(msg){ if(net.hostConn && net.hostConn.open) net.hostConn.send(msg); }
  function broadcast(msg){ for(const c of net.conns.values()){ if(c.open) c.send(msg);} }

  function connectedPlayerList(){
    const host = {id: net.selfId, name: (qs('#myName').value||'房主').trim() || '房主'};
    const arr = [host];
    for(const [pid, c] of net.conns){ arr.push({id:pid, name:(c.metadata && c.metadata.name) || ('玩家-'+pid.slice(-4))}); }
    return arr.slice(0,MAX_PLAYERS);
  }

  function hostStartGame(){
    const plist = connectedPlayerList();
    if(plist.length < 2){ alert('至少2人先可以開始'); return; }

    const hostState = {
      started:true,
      round:1,
      turn:0,
      bid:null,
      players: plist.map(p=>({id:p.id,name:p.name,diceCount:5,alive:true,dice:[]})),
      log:[`🎮 開局成功（${plist.length}人）`]
    };

    // roll private dice for all alive
    for(const p of hostState.players){ p.dice = Array.from({length:p.diceCount},()=>1+Math.floor(Math.random()*6)); }

    net.hostState = hostState;
    pushStateFromHost('🌀 第1回合開始');
  }

  function findPlayerIndexById(id){ return net.hostState.players.findIndex(p=>p.id===id); }
  function nextAliveIdx(idx){ const n=net.hostState.players.length; let i=idx; for(let s=0;s<n;s++){ i=(i+1)%n; if(net.hostState.players[i].alive) return i; } return idx; }
  function aliveCount(){ return net.hostState.players.filter(p=>p.alive).length; }
  function countForFace(face){
    let total=0;
    for(const p of net.hostState.players){ if(!p.alive) continue; for(const d of p.dice){ if(face===1){ if(d===1) total++; } else { if(d===face||d===1) total++; } } }
    return total;
  }
  function isHigherBid(q,f){ const b=net.hostState.bid; if(!b) return q>=1&&f>=1&&f<=6; if(q>b.qty) return true; if(q===b.qty&&f>b.face) return true; return false; }

  function pushStateFromHost(optionalLog){
    if(optionalLog) net.hostState.log.unshift(optionalLog);

    // build public snapshot
    const snap = {
      started: net.hostState.started,
      round: net.hostState.round,
      turn: net.hostState.turn,
      bid: net.hostState.bid,
      players: net.hostState.players.map(p=>({id:p.id,name:p.name,diceCount:p.diceCount,alive:p.alive})),
      log: net.hostState.log.slice(0,120)
    };

    // host itself apply
    applyPublicState(snap);
    game.myDice = (net.hostState.players.find(p=>p.id===net.selfId)?.dice || [1,1,1,1,1]).slice();

    // clients apply + private dice
    for(const [pid, c] of net.conns){
      if(!c.open) continue;
      c.send({type:'state', data:snap});
      const p = net.hostState.players.find(x=>x.id===pid);
      c.send({type:'privateDice', dice:(p?p.dice:[1,1,1,1,1])});
    }
  }

  function hostHandleAction(fromId, msg){
    if(!net.hostState || !net.hostState.started) return;
    const idx = findPlayerIndexById(fromId);
    if(idx<0) return;
    if(idx !== net.hostState.turn) return;
    const p = net.hostState.players[idx];
    if(!p.alive) return;

    if(msg.action==='bid'){
      const q=+msg.qty, f=+msg.face;
      if(!isHigherBid(q,f)) return;
      net.hostState.bid = {qty:q, face:f, by:idx};
      net.hostState.log.unshift(`🗣️ ${p.name} 叫：${q} 個 ${f} 點`);
      net.hostState.turn = nextAliveIdx(idx);
      pushStateFromHost();
      return;
    }

    if(msg.action==='call'){
      const b=net.hostState.bid; if(!b) return;
      const challengerIdx = idx;
      const bidderIdx = b.by;
      const actual = countForFace(b.face);
      const pass = actual >= b.qty;
      const loserIdx = pass ? challengerIdx : bidderIdx;
      const loser = net.hostState.players[loserIdx];

      net.hostState.log.unshift(`🧨 ${net.hostState.players[challengerIdx].name} 開骰：實際 ${actual} 粒 ${b.face} 點`);
      const reveal = net.hostState.players.filter(x=>x.alive).map(x=>`${x.name}：${x.dice.map(v=>diceGlyph[v-1]).join(' ')}`).join(' ｜ ');
      net.hostState.log.unshift(`🎲 全桌骰面：${reveal}`);

      loser.diceCount = Math.max(0, loser.diceCount-1);
      if(loser.diceCount===0){ loser.alive=false; net.hostState.log.unshift(`☠️ ${loser.name} 出局`); }
      else net.hostState.log.unshift(`➖ ${loser.name} 扣1粒，剩 ${loser.diceCount} 粒`);

      if(aliveCount()===1){
        const w=net.hostState.players.find(x=>x.alive);
        net.hostState.log.unshift(`🏆 ${w.name} 勝出`);
        pushStateFromHost();
        return;
      }

      // next round, loser starts (or next alive)
      let starter = loserIdx;
      if(!net.hostState.players[starter].alive) starter = nextAliveIdx(starter);
      net.hostState.round += 1;
      net.hostState.turn = starter;
      net.hostState.bid = null;
      for(const pl of net.hostState.players){ if(pl.alive) pl.dice = Array.from({length:pl.diceCount},()=>1+Math.floor(Math.random()*6)); }
      pushStateFromHost(`🌀 第${net.hostState.round}回合開始，由 ${net.hostState.players[starter].name} 先手`);
      return;
    }
  }

  // ===== UI =====
  function applyPublicState(s){
    game.started = s.started;
    game.round = s.round;
    game.turn = s.turn;
    game.bid = s.bid;
    game.players = s.players;
    game.log = s.log || [];

    qs('#lobby').classList.add('hide');
    qs('#game').classList.remove('hide');

    const me = game.players.find(p=>p.id===net.selfId);
    const turnP = game.players[game.turn];
    qs('#roundInfo').textContent = `第 ${game.round} 回合`;
    qs('#turnInfo').textContent = turnP ? `輪到：${turnP.name}` : '等待中';
    qs('#bidInfo').textContent = game.bid ? `當前叫骰：${game.bid.qty} 個 ${game.bid.face} 點（${game.players[game.bid.by].name}）` : '當前叫骰：未開始';
    qs('#roleInfo').textContent = `你是：${me?me.name:'-'}${net.isHost?'（房主）':''}`;

    qs('#playersBoard').innerHTML = game.players.map((p,i)=>`<div class="pbox ${p.alive?'':'dead'}"><div><b>${p.name}</b>${i===game.turn&&p.alive?' <span class="pill">輪到</span>':''}</div><div>剩餘骰數：<b>${p.diceCount}</b></div><div class="muted">${p.alive?'存活':'出局'}</div></div>`).join('');
    qs('#log').innerHTML = game.log.map(x=>`<div>${x}</div>`).join('');

    const myTurn = me && me.alive && game.players[game.turn]?.id===net.selfId;
    qs('#privateHint').textContent = myTurn ? '到你：先按「擲骰（本手）」睇自己骰，再選擇出價/開。' : '等待其他玩家操作';
    qs('#rollBtn').disabled = !myTurn;
    qs('#bidBtn').disabled = !myTurn;
    qs('#callBtn').disabled = !myTurn || !game.bid;
    if(!myTurn){ qs('#myDice').classList.add('hide'); qs('#hideDiceBtn').classList.add('hide'); }
  }

  function showMyDiceAndAnimate(){
    const md = (game.myDice && game.myDice.length) ? game.myDice.slice() : [1,1,1,1,1];
    while(md.length<5) md.push(1);
    rollTo(md);
    qs('#myDice').classList.remove('hide');
    qs('#myDice').textContent = `你的骰：${md.map(v=>diceGlyph[v-1]).join(' ')}`;
    qs('#hideDiceBtn').classList.remove('hide');
  }

  // ===== Peer setup =====
  function mkRoom(){ return 'ld-' + Math.random().toString(36).slice(2,8); }
  function myName(){ return (qs('#myName').value||'玩家').trim() || '玩家'; }

  function setupCommonPeerHandlers(){
    net.peer.on('open', id=>{
      net.selfId = id;
      qs('#connInfo').textContent = `已連線，ID：${id}`;
      if(net.isHost){ qs('#roomCode').textContent = net.roomId; }
    });
    net.peer.on('error', err=>{ qs('#connInfo').textContent = `連線錯誤：${err.type||err.message}`; });
  }

  qs('#hostBtn').addEventListener('click', ()=>{
    if(net.peer) return;
    net.isHost = true;
    net.roomId = mkRoom();
    net.peer = new Peer(net.roomId);
    setupCommonPeerHandlers();
    qs('#hostPanel').classList.remove('hide');

    net.peer.on('connection', conn=>{
      if(net.conns.size + 1 >= MAX_PLAYERS){ conn.on('open',()=>conn.send({type:'reject',reason:'房已滿'})); return; }
      conn.on('open', ()=>{
        net.conns.set(conn.peer, conn);
        conn.send({type:'welcome', roomId:net.roomId});
      });
      conn.on('data', msg=>{
        if(msg.type==='action') hostHandleAction(conn.peer, msg);
      });
      conn.on('close', ()=>{
        net.conns.delete(conn.peer);
      });
    });
  });

  qs('#joinBtn').addEventListener('click', ()=>{
    const room = (qs('#roomInput').value||'').trim();
    if(!room) return alert('請輸入房間碼');
    if(net.peer) return;
    net.isHost = false;
    net.peer = new Peer();
    setupCommonPeerHandlers();

    net.peer.on('open', ()=>{
      const c = net.peer.connect(room, {metadata:{name:myName()}});
      net.hostConn = c;
      c.on('open', ()=>{ qs('#connInfo').textContent = `已加入房間：${room}`; });
      c.on('data', msg=>{
        if(msg.type==='reject'){ alert(msg.reason||'被拒絕'); return; }
        if(msg.type==='state'){ applyPublicState(msg.data); }
        if(msg.type==='privateDice'){ game.myDice = (msg.dice||[1,1,1,1,1]).slice(); }
      });
      c.on('close', ()=>{ qs('#connInfo').textContent = '與房主連線中斷'; });
    });
  });

  qs('#startGameBtn').addEventListener('click', ()=>{
    if(!net.isHost) return;
    hostStartGame();
  });

  // actions
  qs('#rollBtn').addEventListener('click', ()=>{ showMyDiceAndAnimate(); });
  qs('#hideDiceBtn').addEventListener('click', ()=>{ qs('#myDice').classList.add('hide'); qs('#hideDiceBtn').classList.add('hide'); });
  qs('#bidBtn').addEventListener('click', ()=>{
    const qty=+qs('#qty').value, face=+qs('#face').value;
    if(net.isHost) hostHandleAction(net.selfId, {action:'bid',qty,face});
    else sendHost({type:'action', action:'bid', qty, face});
  });
  qs('#callBtn').addEventListener('click', ()=>{
    if(net.isHost) hostHandleAction(net.selfId, {action:'call'});
    else sendHost({type:'action', action:'call'});
  });

  for(let i=1;i<=6;i++){ const o=document.createElement('option'); o.value=i; o.textContent=i; qs('#face').appendChild(o); }
})();
</script>
</body>
</html>
