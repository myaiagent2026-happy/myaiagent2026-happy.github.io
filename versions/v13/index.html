<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>大話骰｜v12 Hybrid</title>
<style>
:root{--bg:#0b2f1d;--bg2:#07160f;--text:#e9f6ea;--muted:#97b7a0;--die:52px;--depth:10px}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:10px;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;color:var(--text);background:radial-gradient(900px 500px at 50% 35%,#1d5a3a 0%,transparent 65%),linear-gradient(180deg,var(--bg),var(--bg2))}
.app{width:min(100%,430px)}.title{text-align:center}.title h1{margin:0;font-size:40px}.sub{color:var(--muted);font-weight:600;letter-spacing:1px}.pill{margin:12px auto;display:block;width:max-content;padding:8px 16px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff2a;color:#97e89f;font-weight:800}
.stage{border:1px solid #ffffff1f;border-radius:18px;background:#0000002e;padding:10px;box-shadow:0 14px 30px #0000005a}
#view{width:100%;height:190px;border-radius:12px;display:block}
#fallback{display:none}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;justify-items:center;min-height:92px;align-items:center}
.die{position:relative;width:calc(var(--die) + var(--depth));height:calc(var(--die) + var(--depth));filter:drop-shadow(0 8px 14px rgba(0,0,0,.42))}
.cube2d{position:absolute;inset:0}.front,.top,.side{position:absolute;border:1px solid #c6ced6}.front{left:0;top:var(--depth);width:var(--die);height:var(--die);border-radius:12px;background:linear-gradient(145deg,#fff,#ecf2f7);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:12%;gap:6%}.top{left:var(--depth);top:0;width:var(--die);height:var(--depth);border-radius:8px 8px 0 0;background:linear-gradient(180deg,#fff,#e9eff6);transform:skewX(-45deg);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:1px 6px;gap:1px;align-items:center}.side{left:var(--die);top:var(--depth);width:var(--depth);height:var(--die);border-radius:0 8px 8px 0;background:linear-gradient(180deg,#e9eff6,#dce5ee);transform:skewY(-45deg)}
.pip{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2a3440,#111821)}
.pip-top{width:4px;height:4px;border-radius:50%;background:#1f2a37;justify-self:center;align-self:center}
.v1 .pip:nth-child(1){grid-area:2/2}.v2 .pip:nth-child(1){grid-area:1/1}.v2 .pip:nth-child(2){grid-area:3/3}.v3 .pip:nth-child(1){grid-area:1/1}.v3 .pip:nth-child(2){grid-area:2/2}.v3 .pip:nth-child(3){grid-area:3/3}.v4 .pip:nth-child(1){grid-area:1/1}.v4 .pip:nth-child(2){grid-area:1/3}.v4 .pip:nth-child(3){grid-area:3/1}.v4 .pip:nth-child(4){grid-area:3/3}.v5 .pip:nth-child(1){grid-area:1/1}.v5 .pip:nth-child(2){grid-area:1/3}.v5 .pip:nth-child(3){grid-area:2/2}.v5 .pip:nth-child(4){grid-area:3/1}.v5 .pip:nth-child(5){grid-area:3/3}.v6 .pip:nth-child(1){grid-area:1/1}.v6 .pip:nth-child(2){grid-area:1/3}.v6 .pip:nth-child(3){grid-area:2/1}.v6 .pip:nth-child(4){grid-area:2/3}.v6 .pip:nth-child(5){grid-area:3/1}.v6 .pip:nth-child(6){grid-area:3/3}
.roll2d{animation:r .7s cubic-bezier(.22,.8,.34,1)}@keyframes r{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(-14px) rotate(-12deg)}55%{transform:translateY(6px) rotate(10deg)}100%{transform:translateY(0) rotate(0)}}
.btn{margin-top:12px;width:100%;border:none;border-radius:16px;padding:14px 16px;font-size:34px;font-weight:900;letter-spacing:3px;color:#08220f;background:linear-gradient(180deg,#79e67f,#3ec65a);box-shadow:0 12px 24px #26b84a66}
.sound{margin:10px auto 0;background:#ffffff12;border:1px solid #ffffff22;border-radius:999px;padding:9px 16px;color:var(--muted);display:block}
.res{margin-top:12px;border:1px solid #ffffff1f;border-radius:14px;background:#0000002a;padding:12px;text-align:center}.vals{font-size:32px;font-weight:900;letter-spacing:6px;color:#8ef59b}.sum{font-size:44px;font-weight:900}.tip{margin-top:8px;color:#89a594;font-size:13px}
</style></head>
<body><main class="app"><section class="title"><h1>🎲 大話骰</h1><div class="sub" id="mode">REAL 3D · CASINO STYLE</div></section><span class="pill">總點數：<span id="sumTop">0</span></span><section class="stage"><canvas id="view"></canvas><div id="fallback"><div class="row" id="row"></div></div></section><button class="btn" id="roll">擲骰</button><button class="sound" id="sound">🔊 音效</button><section class="res"><div style="color:#9bc4a7">結果</div><div class="vals" id="vals">- ・ - ・ - ・ - ・ -</div><div class="sum" id="sum">0</div><div class="tip">提示：可輪流擲，方便朋友聚會玩大話骰</div></section></main>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
const valsEl=document.getElementById('vals'),sumEl=document.getElementById('sum'),sumTop=document.getElementById('sumTop'),modeEl=document.getElementById('mode');
let audioCtx=null,soundOn=true;function ensureAudio(){if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC()}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()}function play(){if(!soundOn||!audioCtx)return;const t=audioCtx.currentTime;[220,290,340,300].forEach((hz,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=hz;g.gain.setValueAtTime(0.0001,t+i*.04);g.gain.exponentialRampToValueAtTime(.03,t+i*.04+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+i*.04+.11);o.connect(g).connect(audioCtx.destination);o.start(t+i*.04);o.stop(t+i*.04+.12)})}
document.getElementById('sound').addEventListener('click',e=>{ensureAudio();soundOn=!soundOn;e.target.textContent=soundOn?'🔊 音效':'🔇 靜音';e.target.style.opacity=soundOn?'1':'.6'});
const layouts={1:[[2,2]],2:[[1,1],[3,3]],3:[[1,1],[2,2],[3,3]],4:[[1,1],[1,3],[3,1],[3,3]],5:[[1,1],[1,3],[2,2],[3,1],[3,3]],6:[[1,1],[1,3],[2,1],[2,3],[3,1],[3,3]]};
function renderScore(nums){const s=nums.reduce((a,b)=>a+b,0);valsEl.textContent=nums.join(' ・ ');sumEl.textContent=s;sumTop.textContent=s}
let rollImpl=null;
function setupFallback(){document.getElementById('view').style.display='none';document.getElementById('fallback').style.display='block';modeEl.textContent='3D STYLE · TELEGRAM SAFE (v13)';const row=document.getElementById('row');const dice=Array.from({length:5},()=>{const d=document.createElement('div');d.className='die';d.innerHTML='<div class="cube2d"><div class="top"></div><div class="side"></div><div class="front"></div></div>';row.appendChild(d);return d});function draw(cube,n){const front=cube.querySelector('.front');const top=cube.querySelector('.top');front.className='front v'+n;front.innerHTML='';layouts[n].forEach(([r,c])=>{const p=document.createElement('span');p.className='pip';p.style.gridRow=r;p.style.gridColumn=c;front.appendChild(p)});top.innerHTML='';layouts[n].forEach(([r,c])=>{const t=document.createElement('span');t.className='pip-top';t.style.gridRow=r;t.style.gridColumn=c;top.appendChild(t)})}
rollImpl=(playAudio=true)=>{if(playAudio){try{ensureAudio();play()}catch{}}const nums=[];dice.forEach((d,i)=>{const n=Math.floor(Math.random()*6)+1;nums.push(n);const c=d.querySelector('.cube2d');c.classList.remove('roll2d');void c.offsetWidth;c.classList.add('roll2d');setTimeout(()=>draw(c,n),120+i*25)});setTimeout(()=>renderScore(nums),740)};setTimeout(()=>rollImpl(false),120)}
function setupWebGL(){const canvas=document.getElementById('view');let renderer;try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true})}catch(e){setupFallback();return}
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(36,1,0.1,100);camera.position.set(0,4.2,8.8);camera.lookAt(0,0,0);scene.add(new THREE.HemisphereLight(0xffffff,0x1a3a26,1.2));const dl=new THREE.DirectionalLight(0xffffff,1.1);dl.position.set(4,8,5);scene.add(dl);const floor=new THREE.Mesh(new THREE.PlaneGeometry(26,10),new THREE.MeshStandardMaterial({color:0x11412a,roughness:.9,metalness:0}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.7;scene.add(floor);
function faceTex(n){const c=document.createElement('canvas');c.width=256;c.height=256;const g=c.getContext('2d');g.fillStyle='#f7fbff';g.fillRect(0,0,256,256);g.strokeStyle='#c7d1da';g.lineWidth=6;g.strokeRect(3,3,250,250);const pos={1:[[128,128]],2:[[64,64],[192,192]],3:[[64,64],[128,128],[192,192]],4:[[64,64],[192,64],[64,192],[192,192]],5:[[64,64],[192,64],[128,128],[64,192],[192,192]],6:[[64,64],[192,64],[64,128],[192,128],[64,192],[192,192]]};g.fillStyle='#142131';for(const [x,y] of pos[n]){g.beginPath();g.arc(x,y,22,0,Math.PI*2);g.fill()}const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}
const mats=()=>[1,6,2,5,3,4].map(v=>new THREE.MeshStandardMaterial({map:faceTex(v),roughness:.28,metalness:.05}));
const dice=[];for(let i=0;i<5;i++){const die=new THREE.Mesh(new THREE.BoxGeometry(1.65,1.65,1.65),mats());die.position.set(-5.2+i*2.6,0,0);die.rotation.set(0,0,0);scene.add(die);dice.push({mesh:die,target:new THREE.Euler(),start:new THREE.Euler(),t0:0,dur:900,value:1})}
function rotFor(v){
  // Make TOP face equal to rolled value at rest.
  // Material mapping on BoxGeometry: +X=1, -X=6, +Y=2, -Y=5, +Z=3, -Z=4
  return {
    1:[0,0,-Math.PI/2],      // +X -> +Y
    2:[0,0,0],               // +Y already top
    3:[-Math.PI/2,0,0],      // +Z -> +Y
    4:[ Math.PI/2,0,0],      // -Z -> +Y
    5:[ Math.PI,0,0],        // -Y -> +Y
    6:[0,0, Math.PI/2]       // -X -> +Y
  }[v]
}
function setSize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}setSize();window.addEventListener('resize',setSize);
rollImpl=(playAudio=true)=>{if(playAudio){try{ensureAudio();play()}catch{}}const nums=[];const now=performance.now();dice.forEach((d,i)=>{const v=Math.floor(Math.random()*6)+1;d.value=v;nums.push(v);d.start.copy(d.mesh.rotation);const [rx,ry,rz]=rotFor(v);const spinX=2*Math.PI*(3+Math.floor(Math.random()*3));const spinY=2*Math.PI*(3+Math.floor(Math.random()*3));const spinZ=2*Math.PI*(2+Math.floor(Math.random()*2));d.target.set(rx+spinX,ry+spinY,rz+spinZ);d.t0=now+i*35;d.dur=860+i*25});renderScore(nums)};
function anim(t){for(const d of dice){const p=Math.min(1,Math.max(0,(t-d.t0)/d.dur));const e=1-Math.pow(1-p,3);d.mesh.rotation.x=d.start.x+(d.target.x-d.start.x)*e;d.mesh.rotation.y=d.start.y+(d.target.y-d.start.y)*e;d.mesh.rotation.z=d.start.z+(d.target.z-d.start.z)*e;d.mesh.position.y=(p<1)?Math.sin(p*Math.PI)*0.6:0}renderer.render(scene,camera);requestAnimationFrame(anim)}requestAnimationFrame(anim);setTimeout(()=>rollImpl(false),150)
}
if(/Telegram/i.test(navigator.userAgent)) setupFallback(); else setupWebGL();
document.getElementById('roll').addEventListener('click',()=>rollImpl&&rollImpl(true));
</script></body></html>
